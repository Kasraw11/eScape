services:
  postgres:
    image: postgres:16-alpine
    container_name: escape_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: escape_db
      POSTGRES_USER: escape
      POSTGRES_PASSWORD: escape_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escape -d escape_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  osrm:
    image: osrm/osrm-backend:latest
    container_name: escape_osrm
    restart: unless-stopped
    command: >
      sh -c "
      if [ ! -f /data/melbourne.osrm ]; then
        osrm-extract -p /opt/foot.lua /data/melbourne.osm.pbf &&
        osrm-partition /data/melbourne.osrm &&
        osrm-customize /data/melbourne.osrm;
      fi &&
      osrm-routed --algorithm mld --port 5000 /data/melbourne.osrm"
    ports:
      - "5000:5000"
    volumes:
      - ./routing-data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/5000"]
      interval: 30s
      timeout: 10s
      retries: 5

  mysql:
    image: mysql:8.4
    container_name: escape_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-escape_db}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  mysql_data:
